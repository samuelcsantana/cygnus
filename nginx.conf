server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (see security-headers.conf — also included below inside
    # every location block that sets its own add_header, since nginx doesn't
    # inherit add_header across a block that defines one of its own; this
    # top-level include only covers a location that adds no headers itself).
    include /etc/nginx/conf.d/security-headers.conf;

    # Client-side routing (React Router) — always fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Only build-generated, hashed assets may be cached immutably.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri =404;
    }

    # This public document is intentionally embeddable on another origin. Defining
    # headers here replaces inherited app headers, including X-Frame-Options.
    # API_ORIGIN is substituted by the official image's entrypoint at startup.
    location /embed/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ${API_ORIGIN}; frame-ancestors *;" always;
        add_header Cache-Control "public, max-age=600";
        try_files $uri =404;
    }

    location /mf/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=600";
        try_files $uri =404;
    }

    location /mf/assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Public filenames survive deploys; revalidate them instead of treating them
    # like hashed bundles. Missing scripts must not receive the SPA's HTML shell.
    location ~* ^/(?:sw\.js|manifest\.webmanifest|favicon\.svg|icon-[0-9]+\.png)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
