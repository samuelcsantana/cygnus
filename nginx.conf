server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (see security-headers.conf — also included below inside
    # every location block that sets its own add_header, since nginx doesn't
    # inherit add_header across a block that defines one of its own; this
    # top-level include only covers a location that adds no headers itself).
    include /etc/nginx/conf.d/security-headers.conf;

    # Client-side routing (React Router) — always fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
