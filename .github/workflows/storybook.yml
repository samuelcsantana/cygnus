name: Deploy Storybook

# Publishes the design system to GitHub Pages on every push to main, so the
# documented components are always the ones actually shipped.
#
# No manual repository setup is needed: `configure-pages` runs with
# `enablement: true`, which turns Pages on (source: GitHub Actions) through the
# API using the workflow's own token on the first run.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build Storybook
        # Pages serves the site from /cygnus/, not the domain root.
        env:
          STORYBOOK_BASE_PATH: /cygnus/
        run: npm run build-storybook

      - uses: actions/configure-pages@v5
        with:
          # Enables Pages on the repository if it is not already on, instead of
          # failing and waiting for someone to flip the setting by hand.
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
