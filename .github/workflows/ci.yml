name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      # Compares the hand-written Zod schemas against cygnus-api's published
      # openapi.json. It catches the one class of defect nothing else here
      # catches: the API answers 200, the front's parse fails, and the screen
      # says "could not load" with no error in the log and none in Sentry. That
      # is how the vaccine calendar stayed broken for thirteen days.
      #
      # It fetches the contract over the network on every run. A committed copy
      # would drop that dependency but would go stale, and a gate comparing
      # against an old contract stays green while production drifts — the same
      # silence it exists to break.
      - name: Contract drift
        run: npm run contract:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # Runs every story as a test in a real headless Chromium: render smoke tests,
  # the `play` function assertions, and axe on each story. Kept as its own job
  # because it needs a browser download the jsdom suite above does not.
  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Keyed on the *resolved* Playwright version, not the range in
      # package.json ("^1.62.1" can resolve to different builds, and each one
      # expects its own browser revision) and not on a lockfile hash (which
      # would discard a perfectly good browser on any unrelated dependency
      # bump).
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # This was an unconditional `playwright install --with-deps` and it hung
      # on the Chromium download three runs in a row — long enough to burn the
      # job each time, without a single story having run. Caching takes the
      # download off the common path entirely; the job now only depends on the
      # Playwright CDN when the version actually changes.
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The OS packages `--with-deps` pulls in live outside
      # ~/.cache/ms-playwright, so a cache hit restores the browser but not
      # what it links against. This half runs every time regardless.
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Test stories (interaction + accessibility)
        run: npm run test:storybook

      - name: Build Storybook
        run: npm run build-storybook
